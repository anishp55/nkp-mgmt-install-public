
name: 03 - apply idp

on:
  workflow_dispatch:
  workflow_call:

jobs:
  apply_idp:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./
    steps:
    - name: Checkout code
      uses: actions/checkout@main

    - name: apply idp
      run: |
        source ${GITHUB_WORKSPACE}/nkp-vars.sh
        export PATH=$PATH:~/bin
        export KUBECONFIG=~/kubectl-configs/$CLUSTER_NAME.conf
        export MGMT_HOSTNAME=$( kubectl get kommanderclusters.kommander.mesosphere.io  -n kommander host-cluster -oyaml | yq '.spec.ingress.hostname // .status.ingress.address' )
        cat ./idps/auth0-oidc-idp.yaml | envsubst | kubectl apply -f -

    - name: apply ldap
      run: |
        source ${GITHUB_WORKSPACE}/nkp-vars.sh
        export PATH=$PATH:~/bin
        export KUBECONFIG=~/kubectl-configs/$CLUSTER_NAME.conf
        export MGMT_HOSTNAME=$( kubectl get kommanderclusters.kommander.mesosphere.io  -n kommander host-cluster -oyaml | yq '.spec.ingress.hostname // .status.ingress.address' )
        export NAMESPACE=kommander
        cat ./ldap/00-ntnx-ldap-secret.yaml | envsubst | kubectl apply -f -
        cat ./ldap/01-ldap.yaml| envsubst | kubectl apply -f -
        cat ./ldap/02-nkp-admins.yaml | envsubst | kubectl apply -f -
        cat ./ldap/03-nkp-admins-vgcrb.yaml | envsubst | kubectl apply -f -

          