name: 05a - update kommander

on:
  workflow_dispatch:
  workflow_call:


jobs:
  kommander:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./
    steps:
    - name: Checkout code
      uses: actions/checkout@main

    - name: apply kommander configmap
      run: |
        source ${GITHUB_WORKSPACE}/nkp-vars.sh
        export PATH=$PATH:~/bin
        export KUBECONFIG=~/kubectl-configs/$CLUSTER_NAME.conf
        kubectl apply -f ./appdeployments/kommander/kommander-cm.yaml

    - name: update kommander appdeployment
      run: |
        source ${GITHUB_WORKSPACE}/nkp-vars.sh
        export PATH=$PATH:~/bin
        export KUBECONFIG=~/kubectl-configs/$CLUSTER_NAME.conf
        export KOMMANDER_VERSION=$(kubectl get clusterapps | grep "^kommander-0\.$(echo $NKP_VERSION | cut -d. -f2)\." | awk '{print $1}')
        nkp-$NKP_VERSION create appdeployment kommander --app $KOMMANDER_VERSION -c kommander-overrides -w kommander-workspace --dry-run -oyaml | kubectl apply -f -
